[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipasign"
version = "1.0.0"
description = "iOS IPA re-signing toolkit: pure-Python signing engine with a terminal UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ipasign contributors" }]
keywords = ["ios", "ipa", "codesign", "sideload", "mach-o"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Archiving :: Packaging",
]

dependencies = [
    "cryptography>=41",
    "requests>=2.28",
    "rich>=13",
]

[project.optional-dependencies]
device = ["pymobiledevice3>=9.0"]
dev = ["pytest>=8"]
all = ["pymobiledevice3>=9.0", "pytest>=8"]

[project.scripts]
ipasign = "ipasign.app:main"

[tool.setuptools.packages.find]
include = ["ipasign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
ipasign = [
    "native/*/*.dll",
    "native/*/*.so",
    "native/*/*.dylib",
    "native/*.md",
    "vendor/apple-auth.LICENSE",
]
