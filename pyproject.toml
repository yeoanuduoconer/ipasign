[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipasign"
version = "0.1.0"
description = "Cross-platform iOS IPA re-signing toolkit with a pure-Python signing engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ipasign" }]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ipasign = "ipasign.cli:main"

[tool.setuptools.packages.find]
include = ["ipasign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
